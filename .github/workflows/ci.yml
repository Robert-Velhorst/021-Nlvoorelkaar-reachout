name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Repository safety
        run: python scripts/check_repository_safety.py --history

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Test
        run: python -m pytest -q

      - name: Local critical path
        run: python nlve_cli.py smoke

      - name: Package consistency
        run: python -m pip check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Dependency audit
        run: |
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-dev.txt
          python -m pip_audit -r requirements-build.txt

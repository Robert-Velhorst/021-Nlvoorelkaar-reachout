name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and verify release
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Attest release archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.zip
      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: nlvoorelkaar-reachout-windows
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.cdx.json
          if-no-files-found: error
          retention-days: 30

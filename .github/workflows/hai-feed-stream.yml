name: HAI feed real HTTP streaming boundary
on:
  pull_request:
    paths:
      - connectors/hai_bridge.py
      - tests/test_hai_bridge_origin_boundary.py
      - tests/test_web_api.py
      - scripts/review_hai_origin_boundary.py
      - .github/qualification/nlve-feed-stream.json
      - .github/scripts/review_nlve_feed_stream.py
      - .github/scripts/qualify_nlve_feed_stream.py
      - .github/workflows/hai-feed-stream.yml
permissions:
  contents: read
jobs:
  decoded-body-and-credential-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Qualify original and candidate over real owned HTTP and current Requests
        run: python .github/scripts/qualify_nlve_feed_stream.py
      - name: Retain exact source, real HTTP observations and complete audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nlve-feed-stream-${{ github.run_id }}-${{ github.run_attempt }}
          path: nlve-feed-evidence/
          if-no-files-found: error
          retention-days: 14

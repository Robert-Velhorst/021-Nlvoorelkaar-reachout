name: HAI bridge origin and bearer boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  original-source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Install the original declared dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compare identical new regressions against original and candidate source
        run: python scripts/review_hai_origin_boundary.py
      - name: Retain complete source identities and raw case results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hai-origin-boundary-evidence
          path: ${{ runner.temp }}/hai-origin-boundary-evidence/
          if-no-files-found: error
          retention-days: 7
